name: Build

# The unconditional gate: every push and every PR compiles Studio and runs its unit tests.
# Nothing else in the refactor is verifiable without it (docs/refactor/02-execution-order.md, Phase 0).
#
# botmaker-shared and botmaker-session are resolved from source, not from JitPack: this pom pins both at
# 0.0.0-SNAPSHOT — the version the umbrella reactor and a local `mvn install` produce — so there is no
# published artifact under those coordinates to download.
#
# The TestFX suites run under Monocle Headless (configured in the pom's surefire block), so no X server is
# needed. `verify` is deliberately not `-Pdist`: the native installers are release.yml's job, not the gate's.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out botmaker-shared
        uses: actions/checkout@v4
        with:
          repository: LiQiyeDev/botmaker-shared
          path: .deps/botmaker-shared

      - name: Check out botmaker-session
        uses: actions/checkout@v4
        with:
          repository: LiQiyeDev/botmaker-session
          path: .deps/botmaker-session

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install botmaker-shared and botmaker-session (0.0.0-SNAPSHOT)
        run: |
          mvn -B -f .deps/botmaker-shared/pom.xml install -DskipTests
          mvn -B -f .deps/botmaker-session/pom.xml install -DskipTests

      - name: Verify
        run: mvn -B verify

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
