name: CI

# One workflow per repo, three jobs distinguished by trigger, not by file:
#
#   build    — every push and PR except version tags: compiles Studio. The gate. (On a tag it would only
#              repeat a compile `package` does anyway, ahead of the job the release is actually waiting on.)
#   package  — version tags (and a manual dispatch dry run): the per-OS app-images and installers.
#   release  — version tags only: publishes them as a GitHub Release, through JReleaser (jreleaser.yml).
#              Note what did NOT move into JReleaser: `package`. jpackage can only build an installer FOR
#              THE HOST OS, so one runner per target OS is jpackage's constraint and not this workflow's,
#              and JReleaser's own assemble.jpackage inherits it unchanged.
#   pages    — version tags only: republishes the same .rpm/.deb as dnf/apt repositories on GitHub Pages.
#
# `package`/`release` were a separate file (release.yml) purely because their trigger differs, which a
# job-level `if:` expresses just as well — and with one file there is one entry in the Actions tab.
#
# Tests are deliberately NOT run (`-DskipTests`): CI is a compile gate, and the suite is run locally.
# -DskipTests still *compiles* the tests, so test code that no longer builds is still caught. (The release
# half always skipped them — packaging an artifact was never the place to discover a red suite.)
#
# botmaker-studio-api, botmaker-plugin-host, botmaker-shared, botmaker-session and botmaker-sdk are all
# resolved FROM SOURCE in both jobs: this pom pins
# every one at 0.0.0-SNAPSHOT — the version the umbrella reactor and a local `mvn install` produce — so
# there is no published artifact under those coordinates to download. `build` checks out their main
# branches (it is a gate: it should notice an upstream break early). `package` checks out the exact tags
# recorded in .deps.env, so a release is reproducible.
#
# `package` used to resolve those three from JitPack instead, which cost a release two things: the tags
# had to be *published* before Studio could even be tagged (three serial `wait_for_jitpack` polls in the
# umbrella release.sh, ahead of the only job that actually takes minutes), and the versions were guessed
# with `git ls-remote --tags | sort -V | tail -1` — "newest tag", which is only usually "the tag this
# release just cut". Building from source costs ~12s and removes both problems.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Skipped on version tags: `package` compiles the same tree anyway (from pinned upstreams rather than
    # their main branches), so on a tag this job is a duplicate compile the release is waiting behind.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The plugin contract. Studio is the host side of it, and the SDK (as plugin #1) compiles against it
      # too — so it has to be installed before the SDK below.
      - name: Check out botmaker-studio-api
        uses: actions/checkout@v4
        with:
          repository: LiQiyeDev/botmaker-studio-api
          path: .deps/botmaker-studio-api

      # The plugin loader. Studio's own, until 2026-08-28. NOT botmaker-plugin-toolkit, which Studio must
      # never resolve — that one is a plugin's dependency and lives on the plugin's classloader.
      - name: Check out botmaker-plugin-host
        uses: actions/checkout@v4
        with:
          repository: LiQiyeDev/botmaker-plugin-host
          path: .deps/botmaker-plugin-host

      - name: Check out botmaker-shared
        uses: actions/checkout@v4
        with:
          repository: LiQiyeDev/botmaker-shared
          path: .deps/botmaker-shared

      - name: Check out botmaker-session
        uses: actions/checkout@v4
        with:
          repository: LiQiyeDev/botmaker-session
          path: .deps/botmaker-session

      # Studio compiles against the SDK for type identity (palette/SdkType), so the gate needs it too.
      - name: Check out botmaker-sdk
        uses: actions/checkout@v4
        with:
          repository: LiQiyeDev/botmaker-sdk
          path: .deps/botmaker-sdk

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install the five upstreams (0.0.0-SNAPSHOT)
        run: |
          mvn -B -f .deps/botmaker-studio-api/pom.xml install -DskipTests
          mvn -B -f .deps/botmaker-plugin-host/pom.xml install -DskipTests
          mvn -B -f .deps/botmaker-shared/pom.xml install -DskipTests
          mvn -B -f .deps/botmaker-session/pom.xml install -DskipTests
          mvn -B -f .deps/botmaker-sdk/pom.xml install -DskipTests

      # Deliberately not `-Pdist`: the native installers are the `package` job's business, not the gate's.
      - name: Build
        run: mvn -B -DskipTests package

  # Build self-contained, per-OS app-images. Runs on a version tag; a manual dispatch is a dry run that
  # produces artifacts but no Release (see the `release` job's condition).
  package:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            javacpp: linux-x86_64
          - os: windows-latest
            platform: windows-x64
            javacpp: windows-x86_64
    runs-on: ${{ matrix.os }}
    # Exposed as an env var (not read straight from secrets) so step `if:` conditions can gate on it — the
    # `secrets` context isn't available in `if`. Empty when the maintainer hasn't configured signing yet.
    env:
      GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # jpackage's RPM build shells out to rpmbuild (not on ubuntu-latest) and its DEB build needs fakeroot.
      # wget + desktop-file-utils are for the AppImage build; dpkg-sig (best-effort) signs the .deb.
      # Without rpm/fakeroot, `-Pdist package` fails on Linux and the whole release job (and Release) aborts.
      # dpkg-sig was dropped from the Ubuntu 24.04 (noble) repos, so it's installed separately and allowed to
      # fail — sign-packages.sh already skips .deb signing gracefully when it's absent (unsigned .deb ships).
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot wget desktop-file-utils
          sudo apt-get install -y dpkg-sig || echo "dpkg-sig unavailable — .deb will ship unsigned"

      # rpmbuild's default payload compression is xz -9 single-threaded, which on a ~400 MB app-image is by
      # far the slowest thing in this job (measured locally against the equally-slow zstd -19 Fedora default:
      # 139s -> 24s for the same rpm, 238 MB -> 241 MB, i.e. +1.3% for -115s). xz -2 threaded is chosen over
      # zstd because every rpm reader can decompress xz regardless of how its rpm was built.
      # Written before the signing step, which appends its own macros to this file.
      - name: Speed up RPM payload compression
        if: runner.os == 'Linux'
        run: printf '%%_binary_payload w2T.xzdio\n' > ~/.rpmmacros

      # Imports the GPG secret key (base64-encoded) so the .rpm/.deb/AppImage can be signed under the
      # "LiQiyeDev" identity. Skipped (leaving unsigned packages) when the signing secrets aren't set, so the
      # pipeline works before the maintainer configures them. See ROADMAP for the one-time key setup.
      - name: Import signing key (Linux)
        if: runner.os == 'Linux' && env.GPG_KEY_ID != ''
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --reload gpg-agent || true
          echo "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          cat >> ~/.rpmmacros <<EOF
          %_gpg_name ${GPG_KEY_ID}
          %__gpg_sign_cmd %{__gpg} gpg --batch --no-verbose --no-armor --pinentry-mode loopback --passphrase "${GPG_PASSPHRASE}" --no-secmem-warning -u "%{_gpg_name}" -sbo %{__signature_filename} %{__plaintext_filename}
          EOF
          echo "BOTMAKER_SIGN=1" >> "$GITHUB_ENV"

      - name: Resolve version label
        id: ver
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME}"
          # On tag pushes GITHUB_REF_NAME is the tag (e.g. v1.0.0); otherwise use the sha.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "label=${ref}" >> "$GITHUB_OUTPUT"
          else
            echo "label=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          # Numeric MAJOR.MINOR.PATCH for jpackage/manifest: strip a leading `v` and any pre-release suffix
          # (v1.0.5 -> 1.0.5, v1.2.0-rc1 -> 1.2.0). Non-tag builds fall back to 1.0.0 (jpackage rejects non-numeric).
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            num="${ref#v}"; num="${num%%-*}"
          else
            num="1.0.0"
          fi
          echo "appversion=${num}" >> "$GITHUB_OUTPUT"

      # The five upstream refs this release is built against, pinned in a committed file rather than
      # guessed from "newest tag". release.sh writes it into the studio release commit; see .deps.env.
      - name: Read pinned upstream tags
        id: deps
        shell: bash
        run: |
          set -a; . ./.deps.env; set +a
          for v in SHARED_TAG SESSION_TAG SDK_TAG STUDIO_API_TAG PLUGIN_HOST_TAG; do
            [ -n "${!v}" ] || { echo "::error::$v is empty in .deps.env"; exit 1; }
          done
          {
            echo "shared=${SHARED_TAG}"
            echo "session=${SESSION_TAG}"
            echo "sdk=${SDK_TAG}"
            echo "studioapi=${STUDIO_API_TAG}"
            echo "pluginhost=${PLUGIN_HOST_TAG}"
          } >> "$GITHUB_OUTPUT"
          echo "building against shared=${SHARED_TAG} session=${SESSION_TAG} sdk=${SDK_TAG} studio-api=${STUDIO_API_TAG} plugin-host=${PLUGIN_HOST_TAG}"

      # The plugin contract, installed first: the SDK and the plugin host compile against it as well.
      - name: Check out botmaker-studio-api
        uses: actions/checkout@v4
        with:
          repository: LiQiyeDev/botmaker-studio-api
          ref: ${{ steps.deps.outputs.studioapi }}
          path: .deps/botmaker-studio-api

      # The plugin loader. NOT botmaker-plugin-toolkit, which Studio must never resolve.
      - name: Check out botmaker-plugin-host
        uses: actions/checkout@v4
        with:
          repository: LiQiyeDev/botmaker-plugin-host
          ref: ${{ steps.deps.outputs.pluginhost }}
          path: .deps/botmaker-plugin-host

      - name: Check out botmaker-shared
        uses: actions/checkout@v4
        with:
          repository: LiQiyeDev/botmaker-shared
          ref: ${{ steps.deps.outputs.shared }}
          path: .deps/botmaker-shared

      - name: Check out botmaker-session
        uses: actions/checkout@v4
        with:
          repository: LiQiyeDev/botmaker-session
          ref: ${{ steps.deps.outputs.session }}
          path: .deps/botmaker-session

      # Studio compiles against the SDK for type identity (palette/SdkType), so the release build needs it.
      - name: Check out botmaker-sdk
        uses: actions/checkout@v4
        with:
          repository: LiQiyeDev/botmaker-sdk
          ref: ${{ steps.deps.outputs.sdk }}
          path: .deps/botmaker-sdk

      # Lands all five at 0.0.0-SNAPSHOT — the version this pom's properties already default to — so the
      # build below needs no -Dbotmaker.*.version at all, and resolves nothing from JitPack.
      - name: Install the five upstreams (0.0.0-SNAPSHOT)
        shell: bash
        run: |
          mvn -B -f .deps/botmaker-studio-api/pom.xml install -DskipTests
          mvn -B -f .deps/botmaker-plugin-host/pom.xml install -DskipTests
          mvn -B -f .deps/botmaker-shared/pom.xml install -DskipTests
          mvn -B -f .deps/botmaker-session/pom.xml install -DskipTests
          mvn -B -f .deps/botmaker-sdk/pom.xml install -DskipTests

      - name: Build app-image and installers
        # One `-Pdist package` produces the app-image *and* this OS's native installers. The installer
        # executions consume the app-image via jpackage's app-image option instead of rebuilding the bundled
        # JDK runtime each — see the `dist` profile in pom.xml. What dominates the remainder is payload
        # compression: rpm's is tuned by the ~/.rpmmacros step above; .deb's (dpkg-deb) and .msi's (WiX)
        # are not exposed by jpackage.
        #
        # bash (Git Bash on Windows) keeps -D argument quoting consistent across both runners.
        # -Djavacpp.platform=<host> selects host-only classifiers for JavaCPP-packaged artifacts. It does
        # NOT govern OpenCV: org.openpnp:opencv is a single jar carrying all seven platforms, with no
        # classifier to select. Trimming that (and Tess4J's/JNA's foreign natives) is the shade <filters>
        # + natives-linux/natives-windows profiles in pom.xml, which is what actually halved the installer.
        # -Dapp.version=<tag> bakes the real version into the jpackage --app-version + manifest
        # Implementation-Version, so the installed app reports its true version (else the updater
        # always sees itself as the pom default 1.0.0 and re-prompts).
        # No -Dbotmaker.*.version: the step above installed shared/session/sdk at 0.0.0-SNAPSHOT, which is
        # exactly what this pom's three version properties already default to.
        shell: bash
        run: mvn -B -Pdist package -DskipTests -Djavacpp.platform=${{ matrix.javacpp }} -Dapp.version=${{ steps.ver.outputs.appversion }}

      # The portable app-image (zipped) is kept as a no-install fallback; the native installers
      # (.deb/.rpm on Linux, .msi on Windows) are emitted by `-Pdist` into target/dist alongside it.
      - name: Sign .rpm/.deb (Linux)
        if: runner.os == 'Linux'
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        # Never let a signing hiccup abort the release — unsigned packages still ship.
        continue-on-error: true
        run: bash .github/scripts/sign-packages.sh

      - name: Package zip + tarball + AppImage + collect installers (Linux)
        if: runner.os == 'Linux'
        run: |
          base="BotMaker-Studio-${{ steps.ver.outputs.label }}-${{ matrix.platform }}"
          # Portable zip + tarball of the app-image (extract-and-run, no installer, no password).
          cd "target/dist"
          zip -r -q "${GITHUB_WORKSPACE}/${base}.zip" "BotMaker Studio"
          tar -czf "${GITHUB_WORKSPACE}/${base}.tar.gz" "BotMaker Studio"
          cd "${GITHUB_WORKSPACE}"
          # Rename native installers to a versioned, platform-tagged name for the release assets.
          for f in target/dist/*.deb target/dist/*.rpm; do
            [ -e "$f" ] || continue
            cp "$f" "${base}.${f##*.}"
          done
          # AppImage (recommended password-free channel; the in-app updater self-updates it).
          bash .github/scripts/build-appimage.sh "${base}.AppImage"

      - name: Package zip + collect installers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/dist/BotMaker Studio" -DestinationPath "BotMaker-Studio-${{ steps.ver.outputs.label }}-${{ matrix.platform }}.zip"
          Get-ChildItem "target/dist/*.msi" | ForEach-Object {
            Copy-Item $_.FullName "BotMaker-Studio-${{ steps.ver.outputs.label }}-${{ matrix.platform }}.msi"
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BotMaker-Studio-${{ matrix.platform }}
          path: |
            BotMaker-Studio-*-${{ matrix.platform }}.zip
            BotMaker-Studio-*-${{ matrix.platform }}.tar.gz
            BotMaker-Studio-*-${{ matrix.platform }}.deb
            BotMaker-Studio-*-${{ matrix.platform }}.rpm
            BotMaker-Studio-*-${{ matrix.platform }}.AppImage
            BotMaker-Studio-*-${{ matrix.platform }}.msi
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    # Only publish a Release for actual tag pushes, not manual dry runs.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      # For packaging/linux/install.sh, tools/changelog-section.sh and CHANGELOG.md — the packages
      # themselves come from `package`. fetch-depth 0 because JReleaser wants the history behind the tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # What this release actually gives you, in the maintainer's own words.
      #
      # `tools/changelog-section.sh` is the SAME script the umbrella's release.sh calls to gate this
      # release (check_changelog), which is the point of it being a script in this repository rather than
      # an awk in two places: a release whose notes are extracted by a different rule than the one that
      # gated it can pass the gate and then publish something else. The awk that used to sit here said so
      # itself, in a comment, and was the second copy anyway.
      #
      # A failure here means the tag was cut by hand, past the gate. The notes degrade to the commit
      # subjects rather than failing a release whose packages are already built and uploaded.
      #
      # Deleted with the awk: a two-sentence preamble reading MIN_SDK_VERSION out of MavenService.java and
      # announcing "Requires BotMaker SDK <x> or newer". That constant was removed on 2026-08-25 with the
      # floor and the banner it described, so the sed had been matching nothing and every release since had
      # shipped notes that began "Requires BotMaker SDK  or newer" and promised a banner that no longer
      # exists. Any pinned SDK opens now; an incompatibility surfaces at compile time.
      - name: Read this release's changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! tools/changelog-section.sh "$version" > release-notes.md; then
            echo "::warning::CHANGELOG.md has no section for $version — falling back to commit subjects"
            git log --pretty='- %s' "$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo HEAD)..HEAD" \
              > release-notes.md
          fi
          echo "JRELEASER_PROJECT_VERSION=$version" >> "$GITHUB_ENV"
          cat release-notes.md

      # The release itself, its notes and its assets are declared in jreleaser.yml. The tag is not: it was
      # pushed by the umbrella's release.sh, which is what ordered this release against the other seven
      # repositories — the one thing JReleaser has no way to express.
      - name: Publish GitHub Release
        uses: jreleaser/release-action@v2
        with:
          version: 1.25.0
          arguments: full-release
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Republish the .rpm/.deb this release just signed as real dnf and apt repositories, so users get updates
  # from `dnf upgrade` / `apt upgrade` rather than by revisiting the Releases page. See build-repo.sh for why
  # the two formats are hosted differently (the rpm is metadata-only; the deb has to be served from here).
  #
  # `needs: release` rather than `needs: package`: the dnf metadata points at GitHub Release download URLs,
  # so the Release must exist first or the repo advertises a 404 for as long as it takes to publish.
  #
  # Deployed as a Pages *artifact*, not by committing to a gh-pages branch — at ~240 MB a release, a branch
  # would grow by that much per tag in git history permanently, even after the file is replaced. Artifact
  # deployments hold no history: each one wholly replaces the last, which is also what makes "latest release
  # only" the natural shape rather than something to prune.
  #
  # One-time setup: repo → Settings → Pages → Source = "GitHub Actions". Without it deploy-pages fails.
  pages:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # Job-level permissions replace the workflow's, so `contents` has to be restated. deploy-pages needs
    # id-token for its OIDC handshake with the Pages service.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Pages allows one deployment at a time; queue rather than cancel, so a release never ends up with the
    # previous tag left live because its own deploy was cancelled by a newer one.
    concurrency:
      group: pages
      cancel-in-progress: false
    env:
      GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
    steps:
      # Only for .github/scripts/build-repo.sh — nothing here is built from source.
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # createrepo_c writes the dnf metadata; apt-ftparchive (apt-utils) writes Packages/Release.
      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y createrepo-c apt-utils

      # Same key and same loopback setup as the `package` job — this is a different runner, so it has to be
      # imported again. Signs the repository *indexes* (repomd.xml.asc, InRelease); the packages themselves
      # were already signed upstream in `package`.
      - name: Import signing key
        if: env.GPG_KEY_ID != ''
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --reload gpg-agent || true
          echo "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          echo "BOTMAKER_SIGN=1" >> "$GITHUB_ENV"

      - name: Build dnf + apt repositories
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: bash .github/scripts/build-repo.sh artifacts site "${GITHUB_REF_NAME}"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
